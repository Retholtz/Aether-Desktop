<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether HUD Overlay</title>
  <style>
    :root {
      --bg-glass: rgba(18, 22, 32, 0.88);
      --border-glass: rgba(255, 255, 255, 0.14);
      --accent: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.35);
      --text-main: #f0f4f8;
      --text-muted: #8e9bb0;
      --status-listening: #00d2ff;
      --status-hearing: #ffd166;
      --status-thinking: #bd00ff;
      --status-executing: #ff9f1c;
      --status-speaking: #06d6a0;
      --status-error: #ef476f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .overlay-card {
      width: 100%;
      height: 100%;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55), 0 0 1px rgba(255, 255, 255, 0.2) inset;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 12px;
      position: relative;
      cursor: grab;
      -webkit-app-region: drag;
    }

    .overlay-card:active {
      cursor: grabbing;
    }

    /* Top Bar: Status Badge & Quick Controls */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--status-listening);
      box-shadow: 0 0 8px var(--status-listening);
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .status-dot.pulse {
      animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.25); opacity: 1; filter: brightness(1.3); }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .status-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--status-listening);
      transition: color 0.3s ease;
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .control-btn {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      transition: all 0.18s ease;
      line-height: 1;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .control-btn.close:hover {
      background: rgba(239, 71, 111, 0.8);
      color: #fff;
    }

    .control-btn.muted {
      background: rgba(239, 71, 111, 0.3);
      color: var(--status-error);
      border-color: var(--status-error);
    }

    /* Middle Row: User Speech Display */
    .user-query-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-tag {
      font-size: 9px;
      font-weight: 700;
      background: rgba(0, 210, 255, 0.15);
      color: var(--accent);
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid rgba(0, 210, 255, 0.3);
      flex-shrink: 0;
    }

    .user-text {
      color: #e2e8f0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-style: italic;
    }

    /* Bottom Row: Agent Prompt / Action */
    .agent-action-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      line-height: 1.25;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .action-icon {
      font-size: 11px;
      flex-shrink: 0;
    }

    .action-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="overlay-card" id="overlayCard" title="Drag to reposition">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="status-group">
        <div class="status-dot pulse" id="statusDot"></div>
        <span class="status-label" id="statusLabel">LISTENING</span>
      </div>
      <div class="window-controls">
        <button class="control-btn" id="muteBtn" title="Mute/Unmute Mic">🎤</button>
        <button class="control-btn" id="restoreBtn" title="Open Main Window">↗</button>
        <button class="control-btn close" id="hideBtn" title="Hide Overlay">✕</button>
      </div>
    </div>

    <!-- User Request Row -->
    <div class="user-query-row" id="userRow">
      <span class="user-tag">USER</span>
      <span class="user-text" id="userSpeechText">Listening for speech...</span>
    </div>

    <!-- Agent Action Prompt Row -->
    <div class="agent-action-row" id="actionRow">
      <span class="action-icon" id="actionIcon">⚡</span>
      <span class="action-text" id="agentActionText">Aether ready</span>
    </div>
  </div>

  <script>
    (function() {
      const statusDot = document.getElementById("statusDot");
      const statusLabel = document.getElementById("statusLabel");
      const userSpeechText = document.getElementById("userSpeechText");
      const actionIcon = document.getElementById("actionIcon");
      const agentActionText = document.getElementById("agentActionText");
      const muteBtn = document.getElementById("muteBtn");
      const restoreBtn = document.getElementById("restoreBtn");
      const hideBtn = document.getElementById("hideBtn");

      let isMuted = false;

      // Color maps for states
      const stateStyles = {
        listening: { color: "#00d2ff", label: "LISTENING", icon: "👂" },
        hearing: { color: "#ffd166", label: "HEARING SPEECH", icon: "🎙️" },
        transcribing: { color: "#b388ff", label: "TRANSCRIBING", icon: "✍️" },
        thinking: { color: "#bd00ff", label: "THINKING", icon: "🧠" },
        executing: { color: "#ff9f1c", label: "EXECUTING TASK", icon: "⚙️" },
        speaking: { color: "#06d6a0", label: "SPEAKING", icon: "🔊" },
        connected: { color: "#00d2ff", label: "CONNECTED", icon: "⚡" },
        disconnected: { color: "#8e9bb0", label: "OFFLINE", icon: "💤" },
        error: { color: "#ef476f", label: "ERROR", icon: "⚠️" }
      };

      function setStatus(state, message, userPrompt, action) {
        const style = stateStyles[state] || { color: "#00d2ff", label: state.toUpperCase(), icon: "⚡" };
        statusDot.style.background = style.color;
        statusDot.style.boxShadow = `0 0 8px ${style.color}`;
        statusLabel.style.color = style.color;
        statusLabel.innerText = style.label;

        if (action) {
          actionIcon.innerText = "⚙️";
          agentActionText.innerText = `Action: ${action}`;
        } else if (message) {
          actionIcon.innerText = style.icon;
          agentActionText.innerText = message;
        }

        if (userPrompt) {
          userSpeechText.innerText = `"${userPrompt}"`;
        }
      }

      // Event listener registered on window for backend GuiBridge calls
      window.aetherOverlay = {
        handleEvent: function(event) {
          if (!event) return;
          const type = event.type;
          const data = event.data || {};

          if (type === "status") {
            setStatus(data.state, data.message, data.user_prompt, data.action);
          } else if (type === "chat_event") {
            if (data.type === "user") {
              userSpeechText.innerText = `"${data.content}"`;
            } else if (data.type === "tool") {
              actionIcon.innerText = "⚙️";
              agentActionText.innerText = `${data.name || "Tool"}: ${data.content || ""}`;
            } else if (data.type === "assistant") {
              actionIcon.innerText = "🔊";
              agentActionText.innerText = `Aether: ${data.content ? data.content.slice(0, 60) + '...' : ''}`;
            }
          } else if (type === "user_speech_stream") {
            if (data.text) {
              userSpeechText.innerText = `"${data.text}"`;
            }
          } else if (type === "mic_muted") {
            isMuted = !!data.muted;
            muteBtn.classList.toggle("muted", isMuted);
            muteBtn.innerText = isMuted ? "🔇" : "🎤";
          }
        }
      };

      // Button Handlers
      restoreBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        if (window.pywebview && window.pywebview.api) {
          window.pywebview.api.restore_main_window();
        }
      });

      hideBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        if (window.pywebview && window.pywebview.api) {
          window.pywebview.api.hide_overlay();
        }
      });

      muteBtn.addEventListener("click", async function(e) {
        e.stopPropagation();
        if (window.pywebview && window.pywebview.api) {
          const res = await window.pywebview.api.toggle_mic_mute();
          if (res && res.success) {
            isMuted = res.muted;
            muteBtn.classList.toggle("muted", isMuted);
            muteBtn.innerText = isMuted ? "🔇" : "🎤";
          }
        }
      });

      // Query theme or accent if available
      window.addEventListener("pywebviewready", async function() {
        if (window.pywebview && window.pywebview.api) {
          try {
            const theme = await window.pywebview.api.get_windows_theme();
            if (theme && theme.accent_color) {
              document.documentElement.style.setProperty("--accent", theme.accent_color);
            }
          } catch(e) {}
        }
      });
    })();
  </script>
</body>
</html>
