<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether HUD Overlay</title>
  <style>
    :root {
      --bg-glass: rgba(18, 22, 32, 0.88);
      --border-glass: rgba(255, 255, 255, 0.14);
      --accent: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.35);
      --text-main: #f0f4f8;
      --text-muted: #8e9bb0;
      --status-listening: #00d2ff;
      --status-hearing: #ffd166;
      --status-thinking: #bd00ff;
      --status-executing: #ff9f1c;
      --status-speaking: #06d6a0;
      --status-error: #ef476f;
      --current-status-color: #00d2ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body {
      padding: 0;
    }

    /* Base Overlay Card Container */
    .overlay-card {
      width: 100vw;
      height: 100vh;
      background: var(--bg-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      box-shadow: 0 0 1px rgba(255, 255, 255, 0.2) inset;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 14px;
      position: relative;
      cursor: grab;
      transition: border-radius 0.25s ease, padding 0.25s ease, border-color 0.25s ease;
      overflow: hidden;
      box-sizing: border-box;
    }

    .overlay-card:active,
    .overlay-card.dragging {
      cursor: grabbing !important;
    }

    /* =========================================================================
       MODE 1: MINI MODE (Compact Mini Box - 180x52)
       ========================================================================= */
    body.mode-mini {
      padding: 0;
    }

    body.mode-mini .overlay-card {
      border-radius: 14px;
      padding: 0 12px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: grab;
      border: 1px solid var(--border-glass);
      box-shadow: 0 0 1px rgba(255, 255, 255, 0.2) inset;
    }

    body.mode-mini .overlay-card:hover {
      border-color: var(--current-status-color, var(--accent));
      filter: brightness(1.08);
    }

    /* Hide standard multi-row controls and panels in Mini Mode */
    body.mode-mini .top-bar,
    body.mode-mini .normal-exchange-pane,
    body.mode-mini .agent-action-row,
    body.mode-mini .transcript-pane {
      display: none !important;
    }

    /* Mini Pill Content */
    .mini-pill-content {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      gap: 9px;
      cursor: grab;
    }

    body.mode-mini .mini-pill-content {
      display: flex;
    }

    .mini-status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--current-status-color, var(--status-listening));
      box-shadow: 0 0 10px var(--current-status-color, var(--status-listening));
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .mini-status-dot.pulse {
      animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .mini-status-label {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--current-status-color, var(--status-listening));
      transition: color 0.3s ease;
      text-align: center;
    }

    /* =========================================================================
       Top Bar: Status Badge, 3-Segment Toggle & Window Controls
       ========================================================================= */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--current-status-color, var(--status-listening));
      box-shadow: 0 0 8px var(--current-status-color, var(--status-listening));
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .status-dot.pulse {
      animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.25); opacity: 1; filter: brightness(1.3); }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .status-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--current-status-color, var(--status-listening));
      transition: color 0.3s ease;
    }

    /* 3-Segment Mode Switcher Control: [ — | ▢ | ⤢ ] */
    .mode-toggle-group {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 1px;
      gap: 2px;
    }

    .mode-segment-btn {
      width: 24px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      line-height: 1;
      transition: all 0.18s ease;
    }

    .mode-segment-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
    }

    .mode-segment-btn.active {
      background: rgba(0, 210, 255, 0.22);
      color: #fff;
      border-color: rgba(0, 210, 255, 0.55);
      box-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
      font-weight: bold;
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .control-btn {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      transition: all 0.18s ease;
      line-height: 1;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .control-btn.close:hover {
      background: rgba(239, 71, 111, 0.8);
      color: #fff;
    }

    .control-btn.muted {
      background: rgba(239, 71, 111, 0.3);
      color: var(--status-error);
      border-color: var(--status-error);
    }

    /* =========================================================================
       MODE 2: NORMAL MODE (Single-Turn Q&A Exchange Pane - Scalable)
       ========================================================================= */
    body.mode-normal .overlay-card {
      padding: 9px 12px;
      gap: 6px;
    }

    .normal-exchange-pane {
      display: none;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-height: 0;
      margin-top: 4px;
      overflow: hidden;
    }

    body.mode-normal .normal-exchange-pane {
      display: flex;
    }

    body.mode-mini .normal-exchange-pane,
    body.mode-max .normal-exchange-pane {
      display: none !important;
    }

    .exchange-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .exchange-row.user-row {
      flex-shrink: 0;
      max-height: 54px;
      overflow-y: auto;
    }

    .exchange-row.agent-row {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .exchange-header {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .speaker-badge {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 1px 4px;
      border-radius: 3px;
      text-transform: uppercase;
      display: inline-block;
    }

    .speaker-badge.user {
      background: rgba(255, 209, 102, 0.18);
      color: var(--status-hearing);
      border: 1px solid rgba(255, 209, 102, 0.35);
    }

    .speaker-badge.agent {
      background: rgba(0, 210, 255, 0.18);
      color: var(--accent);
      border: 1px solid rgba(0, 210, 255, 0.35);
    }

    .exchange-body {
      font-size: 12px;
      line-height: 1.45;
      color: #f1f5f9;
      overflow-y: auto;
      word-break: break-word;
      user-select: text;
    }

    .exchange-body::-webkit-scrollbar {
      width: 4px;
    }
    .exchange-body::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 3px;
    }
    .exchange-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 3px;
    }
    .exchange-body::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 210, 255, 0.4);
    }

    .exchange-body.user-text {
      color: #cbd5e1;
      font-style: italic;
      max-height: 36px;
      white-space: pre-wrap;
    }

    .exchange-body.agent-text {
      flex: 1;
      min-height: 0;
      max-height: none;
      color: #f8fafc;
      padding-right: 4px;
    }

    .exchange-body.agent-text.interrupted {
      color: #ef476f;
      font-style: italic;
    }

    /* =========================================================================
       Rich Markdown & Content Formatting (Code blocks, lists, bold)
       ========================================================================= */
    .formatted-content {
      display: block;
      width: 100%;
    }

    .formatted-content p {
      margin-bottom: 6px;
    }
    .formatted-content p:last-child {
      margin-bottom: 0;
    }

    .formatted-content strong {
      color: #ffffff;
      font-weight: 700;
    }

    .formatted-content em {
      color: #e2e8f0;
      font-style: italic;
    }

    .formatted-content ul, .formatted-content ol {
      margin-left: 18px;
      margin-bottom: 6px;
      padding-left: 0;
    }

    .formatted-content li {
      margin-bottom: 3px;
      line-height: 1.4;
    }

    .hud-section-header {
      font-size: 12.5px;
      font-weight: 700;
      color: #00d2ff;
      letter-spacing: 0.3px;
      margin-top: 4px;
      margin-bottom: 4px;
    }

    .hud-inline-code {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 11px;
      color: #38bdf8;
      user-select: text;
    }

    .hud-code-block {
      background: rgba(10, 14, 22, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      margin: 6px 0;
      overflow-x: auto;
      font-family: Consolas, "Courier New", monospace;
      font-size: 11.5px;
      line-height: 1.4;
      user-select: text;
    }

    .hud-code-header {
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .hud-code-block code {
      display: block;
      padding: 8px;
      color: #e2e8f0;
      white-space: pre;
    }

    /* =========================================================================
       Bottom Row: Agent Action / Status
       ========================================================================= */
    .agent-action-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      line-height: 1.25;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .action-icon {
      font-size: 11px;
      flex-shrink: 0;
    }

    .action-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-main);
    }

    /* =========================================================================
       MODE 3: MAX MODE (Teleprompter / Transcript Pane - Scalable)
       ========================================================================= */
    .transcript-pane {
      display: none;
      flex: 1;
      min-height: 0;
      max-height: none;
      overflow-y: auto;
      margin-top: 8px;
      padding-right: 6px;
      font-size: 12.5px;
      line-height: 1.5;
      user-select: text;
      cursor: default;
    }

    body.mode-max .transcript-pane {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Custom Scrollbar for Transcript */
    .transcript-pane::-webkit-scrollbar {
      width: 5px;
    }
    .transcript-pane::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 4px;
    }
    .transcript-pane::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 4px;
    }
    .transcript-pane::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 210, 255, 0.4);
    }

    /* Teleprompter Turns */
    .transcript-turn {
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: opacity 0.3s ease;
      word-wrap: break-word;
    }

    /* Visual Focus: Dim older turns to opacity: 0.5; keep current active turn at opacity: 1.0 */
    .transcript-turn.dimmed {
      opacity: 0.5;
    }

    .transcript-turn.active {
      opacity: 1.0;
    }

    .turn-header {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .turn-speaker {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 1px 5px;
      border-radius: 4px;
      display: inline-block;
      text-transform: uppercase;
    }

    .turn-speaker.agent {
      background: rgba(0, 210, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(0, 210, 255, 0.3);
    }

    .turn-speaker.user {
      background: rgba(255, 209, 102, 0.15);
      color: var(--status-hearing);
      border: 1px solid rgba(255, 209, 102, 0.3);
    }

    .turn-speaker.tool {
      background: rgba(255, 159, 28, 0.15);
      color: var(--status-executing);
      border: 1px solid rgba(255, 159, 28, 0.3);
    }

    .turn-body {
      color: #f1f5f9;
      font-size: 12.5px;
      user-select: text;
    }

    .turn-body.interrupted {
      color: #ef476f;
      font-style: italic;
    }

    /* =========================================================================
       Resize Handles & Corner Grip (Normal & Max Modes Only)
       ========================================================================= */
    .hud-resizer {
      position: absolute;
      z-index: 100;
      display: none;
    }

    body.mode-normal .hud-resizer,
    body.mode-max .hud-resizer {
      display: block;
    }

    body.mode-mini .hud-resizer {
      display: none !important;
    }

    .resizer-edge-top { top: 0; left: 14px; right: 14px; height: 6px; cursor: ns-resize; }
    .resizer-edge-bottom { bottom: 0; left: 14px; right: 14px; height: 6px; cursor: ns-resize; }
    .resizer-edge-left { left: 0; top: 14px; bottom: 14px; width: 6px; cursor: ew-resize; }
    .resizer-edge-right { right: 0; top: 14px; bottom: 14px; width: 6px; cursor: ew-resize; }

    .resizer-corner-tl { top: 0; left: 0; width: 14px; height: 14px; cursor: nwse-resize; }
    .resizer-corner-tr { top: 0; right: 0; width: 14px; height: 14px; cursor: nesw-resize; }
    .resizer-corner-bl { bottom: 0; left: 0; width: 14px; height: 14px; cursor: nesw-resize; }
    .resizer-corner-br { 
      bottom: 0; 
      right: 0; 
      width: 16px; 
      height: 16px; 
      cursor: nwse-resize;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 3px;
    }

    .resize-grip-icon {
      pointer-events: none;
      opacity: 0.35;
      transition: opacity 0.2s ease, stroke 0.2s ease;
    }
    .resizer-corner-br:hover .resize-grip-icon {
      opacity: 1;
      stroke: var(--accent, #00d2ff);
    }

    /* Standby / Greyed-out State Styling */
    body.status-standby {
      --current-status-color: #8e9bb0;
    }

    body.status-standby .status-dot,
    body.status-standby .mini-status-dot {
      background: #8e9bb0 !important;
      box-shadow: none !important;
      animation: none !important;
    }

    body.status-standby .status-label,
    body.status-standby .mini-status-label {
      color: #8e9bb0 !important;
    }

    body.status-standby .overlay-card {
      border-color: rgba(255, 255, 255, 0.09);
      filter: saturate(0.65);
    }
  </style>
</head>
<body class="mode-normal status-standby">
  <div class="overlay-card pywebview-drag-region" id="overlayCard" title="Drag to reposition (Click pill to expand in Mini Mode)">
    
    <!-- Mini Mode Pill Layout (visible only in .mode-mini) -->
    <div class="mini-pill-content pywebview-drag-region" id="miniPillContent">
      <div class="mini-status-dot" id="miniStatusDot"></div>
      <span class="mini-status-label" id="miniStatusLabel">Aether: Standby</span>
    </div>

    <!-- Top Bar (Normal and Max Modes) -->
    <div class="top-bar">
      <!-- Status Badge -->
      <div class="status-group">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-label" id="statusLabel">STANDBY</span>
      </div>

      <!-- 3-Segment Toggle: [ — | ▢ | ⤢ ] -->
      <div class="mode-toggle-group">
        <button class="mode-segment-btn" id="modeMiniBtn" title="Mini Mode (Utilitarian Pill)">—</button>
        <button class="mode-segment-btn active" id="modeNormalBtn" title="Normal Mode (Card Dock)">▢</button>
        <button class="mode-segment-btn" id="modeMaxBtn" title="Max Mode (Teleprompter Transcript)">⤢</button>
      </div>

      <!-- Window Controls -->
      <div class="window-controls">
        <button class="control-btn" id="muteBtn" title="Mute/Unmute Mic">🎤</button>
        <button class="control-btn" id="restoreBtn" title="Open Main Window">↗</button>
        <button class="control-btn close" id="hideBtn" title="Hide Overlay">✕</button>
      </div>
    </div>

    <!-- Normal Mode: Single-Turn Q&A Exchange Area (clears with each prompt) -->
    <div class="normal-exchange-pane" id="normalExchangePane">
      <div class="exchange-row user-row">
        <div class="exchange-header">
          <span class="speaker-badge user">USER</span>
        </div>
        <div class="exchange-body user-text" id="normalUserText">"Listening for speech..."</div>
      </div>
      <div class="exchange-row agent-row">
        <div class="exchange-header">
          <span class="speaker-badge agent" id="normalAgentTag">AETHER</span>
        </div>
        <div class="exchange-body agent-text" id="normalAgentText">Aether on standby. Start assistant from main window.</div>
      </div>
    </div>

    <!-- Teleprompter / Transcript Pane (Max Mode) -->
    <div class="transcript-pane" id="transcript-pane">
      <div class="transcript-turn dimmed" id="initialTranscriptTurn">
        <div class="turn-header">
          <span class="turn-speaker agent" id="initialTurnSpeaker">AETHER</span>
        </div>
        <div class="turn-body">Aether on standby. Start assistant from main window.</div>
      </div>
    </div>

    <!-- Agent Action Prompt Row -->
    <div class="agent-action-row" id="actionRow">
      <span class="action-icon" id="actionIcon">💤</span>
      <span class="action-text" id="agentActionText">Aether on standby</span>
    </div>

    <!-- 8-Directional Resize Handles (Normal and Max Modes) -->
    <div class="hud-resizer resizer-edge-top" data-dir="t"></div>
    <div class="hud-resizer resizer-edge-bottom" data-dir="b"></div>
    <div class="hud-resizer resizer-edge-left" data-dir="l"></div>
    <div class="hud-resizer resizer-edge-right" data-dir="r"></div>
    <div class="hud-resizer resizer-corner-tl" data-dir="tl"></div>
    <div class="hud-resizer resizer-corner-tr" data-dir="tr"></div>
    <div class="hud-resizer resizer-corner-bl" data-dir="bl"></div>
    <div class="hud-resizer resizer-corner-br" data-dir="br" title="Drag to resize window">
      <svg class="resize-grip-icon" viewBox="0 0 10 10" width="8" height="8">
        <path d="M9 1L1 9M9 5L5 9M9 9L9 9" stroke="rgba(255,255,255,0.4)" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </div>

  </div>

  <script>
    (function() {
      const overlayCard = document.getElementById("overlayCard");
      const miniPillContent = document.getElementById("miniPillContent");
      const miniStatusDot = document.getElementById("miniStatusDot");
      const miniStatusLabel = document.getElementById("miniStatusLabel");

      const statusDot = document.getElementById("statusDot");
      const statusLabel = document.getElementById("statusLabel");
      const actionIcon = document.getElementById("actionIcon");
      const agentActionText = document.getElementById("agentActionText");
      const transcriptPane = document.getElementById("transcript-pane");

      const normalExchangePane = document.getElementById("normalExchangePane");
      const normalUserText = document.getElementById("normalUserText");
      const normalAgentTag = document.getElementById("normalAgentTag");
      const normalAgentText = document.getElementById("normalAgentText");

      const modeMiniBtn = document.getElementById("modeMiniBtn");
      const modeNormalBtn = document.getElementById("modeNormalBtn");
      const modeMaxBtn = document.getElementById("modeMaxBtn");

      const muteBtn = document.getElementById("muteBtn");
      const restoreBtn = document.getElementById("restoreBtn");
      const hideBtn = document.getElementById("hideBtn");

      let isMuted = false;
      let currentMode = "normal";
      let agentName = "Aether";
      let currentStatusState = "standby";

      // Color maps for states
      const stateLabels = {
        listening: "Listening",
        hearing: "Hearing...",
        transcribing: "Transcribing...",
        thinking: "Thinking...",
        executing: "Executing...",
        speaking: "Speaking...",
        connected: "Connected",
        disconnected: "Standby",
        idle: "Standby",
        standby: "Standby",
        offline: "Standby",
        error: "Error"
      };

      function getMiniStatus(state) {
        const action = stateLabels[state] || (state ? state.charAt(0).toUpperCase() + state.slice(1) : "Standby");
        return `${agentName}: ${action}`;
      }

      function updateAgentName(newName) {
        if (!newName || typeof newName !== "string") return;
        const oldName = agentName;
        agentName = newName.trim() || "Aether";

        // 1. Update Normal mode speaker badge
        if (normalAgentTag) {
          normalAgentTag.innerText = agentName.toUpperCase();
        }

        // 2. Update Max mode initial turn speaker tag
        const initialSpeaker = document.getElementById("initialTurnSpeaker");
        if (initialSpeaker) {
          initialSpeaker.innerText = agentName.toUpperCase();
        }

        // 3. Update any existing agent turns in transcript
        if (transcriptPane) {
          transcriptPane.querySelectorAll(".turn-speaker.agent").forEach(el => {
            el.innerText = agentName.toUpperCase();
          });
        }

        // 4. Update initial greeting texts if still showing default greeting
        const isStandby = (currentStatusState === "standby" || currentStatusState === "idle" || currentStatusState === "disconnected" || currentStatusState === "offline");
        const statusDesc = isStandby ? "on standby. Start assistant from main window." : "ready. Speak into your microphone or press your hotkey.";
        if (normalAgentText && (normalAgentText.innerText.includes("standby") || normalAgentText.innerText.includes("ready") || (oldName && normalAgentText.innerText.startsWith(oldName)))) {
          normalAgentText.innerHTML = renderMarkdown(`${agentName} ${statusDesc}`);
        }
        const initialTurnBody = document.querySelector("#initialTranscriptTurn .turn-body");
        if (initialTurnBody && (initialTurnBody.innerText.includes("standby") || initialTurnBody.innerText.includes("ready") || (oldName && initialTurnBody.innerText.startsWith(oldName)))) {
          initialTurnBody.innerHTML = renderMarkdown(`${agentName} ${statusDesc}`);
        }
        if (agentActionText && (agentActionText.innerText.includes("standby") || agentActionText.innerText.includes("ready") || (oldName && agentActionText.innerText.startsWith(oldName)))) {
          agentActionText.innerText = `${agentName} ${isStandby ? 'on standby' : 'ready'}`;
        }

        // 5. Update Pill (Mini) label
        if (miniStatusLabel) {
          miniStatusLabel.innerText = getMiniStatus(currentStatusState);
        }
      }

      // Active Teleprompter Turn References
      let currentTurnDiv = null;
      let currentTurnSpan = null;
      let currentTurnRawText = "";

      const stateStyles = {
        listening: { color: "#00d2ff", label: "LISTENING", icon: "👂" },
        hearing: { color: "#ffd166", label: "HEARING SPEECH", icon: "🎙️" },
        transcribing: { color: "#b388ff", label: "TRANSCRIBING", icon: "✍️" },
        thinking: { color: "#bd00ff", label: "THINKING", icon: "🧠" },
        executing: { color: "#ff9f1c", label: "EXECUTING TASK", icon: "⚙️" },
        speaking: { color: "#06d6a0", label: "SPEAKING", icon: "🔊" },
        connected: { color: "#00d2ff", label: "CONNECTED", icon: "⚡" },
        disconnected: { color: "#8e9bb0", label: "STANDBY", icon: "💤" },
        idle: { color: "#8e9bb0", label: "STANDBY", icon: "💤" },
        standby: { color: "#8e9bb0", label: "STANDBY", icon: "💤" },
        offline: { color: "#8e9bb0", label: "STANDBY", icon: "💤" },
        error: { color: "#ef476f", label: "ERROR", icon: "⚠️" }
      };

      // =========================================================================
      // Safe Markdown & Text Formatter for Rich Agent Responses
      // =========================================================================
      function renderMarkdown(rawText) {
        if (!rawText) return "";
        let text = String(rawText).replace(/\r\n/g, "\n").replace(/\r/g, "\n");

        // 1. Escape HTML entities
        let escaped = text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

        // 2. Extract code blocks with safe alphanumeric token
        const codeBlocks = [];
        escaped = escaped.replace(/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g, function(match, lang, code) {
          const idx = codeBlocks.length;
          codeBlocks.push(
            '<div class="hud-code-block"><div class="hud-code-header">' + (lang || 'CODE') + '</div><code>' + code.trim() + '</code></div>'
          );
          return '@@@HUDCODEBLOCK' + idx + '@@@';
        });

        // Inline formatting helper
        function formatInline(str) {
          if (!str) return "";
          // Inline code
          str = str.replace(/`([^`\n]+)`/g, '<code class="hud-inline-code">$1</code>');
          // Bold
          str = str.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
          // Italic
          str = str.replace(/(^|[^\*])\*([^*]+)\*(?!\*)/g, '$1<em>$2</em>');
          str = str.replace(/(^|[^_])_([^_]+)_(?!_)/g, '$1<em>$2</em>');
          return str;
        }

        // 3. Process line-by-line
        const lines = escaped.split('\n');
        let inList = false;
        let listType = null;
        let out = [];

        for (let i = 0; i < lines.length; i++) {
          let line = lines[i];
          let trimmed = line.trim();

          // Code block placeholder
          let cbMatch = trimmed.match(/^@@@HUDCODEBLOCK(\d+)@@@$/);
          if (cbMatch) {
            if (inList) {
              out.push('</' + listType + '>');
              inList = false;
              listType = null;
            }
            const idx = parseInt(cbMatch[1], 10);
            out.push(codeBlocks[idx] || '');
            continue;
          }

          // Header: ### Header
          let hMatch = trimmed.match(/^(#{1,4})\s+(.+)/);
          if (hMatch) {
            if (inList) {
              out.push('</' + listType + '>');
              inList = false;
              listType = null;
            }
            out.push('<div class="hud-section-header">' + formatInline(hMatch[2]) + '</div>');
            continue;
          }

          // Bullet list: * or -
          let bulletMatch = trimmed.match(/^[\*\-]\s+(.+)/);
          if (bulletMatch) {
            if (!inList || listType !== 'ul') {
              if (inList) out.push('</' + listType + '>');
              out.push('<ul>');
              inList = true;
              listType = 'ul';
            }
            out.push('<li>' + formatInline(bulletMatch[1]) + '</li>');
            continue;
          }

          // Numbered list: 1.
          let numMatch = trimmed.match(/^(\d+)\.\s+(.+)/);
          if (numMatch) {
            if (!inList || listType !== 'ol') {
              if (inList) out.push('</' + listType + '>');
              out.push('<ol>');
              inList = true;
              listType = 'ol';
            }
            out.push('<li>' + formatInline(numMatch[2]) + '</li>');
            continue;
          }

          if (inList) {
            out.push('</' + listType + '>');
            inList = false;
            listType = null;
          }

          if (!trimmed) {
            out.push('<div style="height: 5px;"></div>');
          } else {
            out.push('<p>' + formatInline(line) + '</p>');
          }
        }

        if (inList) {
          out.push('</' + listType + '>');
        }

        return '<div class="formatted-content">' + out.join('') + '</div>';
      }

      // =========================================================================
      // Mode Switching (Mini: 180x52, Normal: Scalable, Max: Scalable)
      // =========================================================================
      function applyModeClasses(mode) {
        currentMode = mode;
        document.body.classList.remove("mode-mini", "mode-normal", "mode-max");
        document.body.classList.add(`mode-${mode}`);

        modeMiniBtn.classList.toggle("active", mode === "mini");
        modeNormalBtn.classList.toggle("active", mode === "normal");
        modeMaxBtn.classList.toggle("active", mode === "max");

        if (mode === "max" && transcriptPane) {
          transcriptPane.scrollTo({ top: transcriptPane.scrollHeight, behavior: 'smooth' });
        }
      }

      async function switchMode(mode) {
        applyModeClasses(mode);
        if (window.pywebview && window.pywebview.api && window.pywebview.api.set_mode) {
          try {
            await window.pywebview.api.set_mode(mode);
          } catch(err) {
            console.warn("Error calling set_mode API:", err);
          }
        }
      }

      // =========================================================================
      // Window Dragging & Movement Logic
      // =========================================================================
      let isDragging = false;
      let dragStartX = 0;
      let dragStartY = 0;
      let dragStartScreenX = 0;
      let dragStartScreenY = 0;
      let hasMovedDuringDrag = false;
      let suppressNextClick = false;
      let suppressTimeoutId = null;

      function onDragMouseDown(e) {
        // Exclude interactive buttons, toggles, controls, scrollable text, and resize handles
        if (e.target.closest('button, .mode-toggle-group, .window-controls, .transcript-pane, .exchange-body, .hud-resizer')) {
          return;
        }
        if (e.button !== 0) return; // Only left-click drags

        isDragging = true;
        hasMovedDuringDrag = false;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        dragStartScreenX = e.screenX;
        dragStartScreenY = e.screenY;
        overlayCard.classList.add("dragging");

        window.addEventListener("mousemove", onDragMouseMove);
        window.addEventListener("mouseup", onDragMouseUp);
      }

      function onDragMouseMove(e) {
        if (!isDragging) return;
        const dx = Math.abs(e.screenX - dragStartScreenX);
        const dy = Math.abs(e.screenY - dragStartScreenY);
        if (dx > 3 || dy > 3) {
          hasMovedDuringDrag = true;
          suppressNextClick = true;
        }

        const newX = e.screenX - dragStartX;
        const newY = e.screenY - dragStartY;

        // Try PyWebView move callback first, fall back to RPC move_overlay
        if (window.pywebview && window.pywebview._jsApiCallback) {
          window.pywebview._jsApiCallback('pywebviewMoveWindow', [newX, newY], 'move');
        } else if (window.pywebview && window.pywebview.api && window.pywebview.api.move_overlay) {
          window.pywebview.api.move_overlay(newX, newY);
        }
      }

      function onDragMouseUp(e) {
        if (isDragging) {
          isDragging = false;
          overlayCard.classList.remove("dragging");
          window.removeEventListener("mousemove", onDragMouseMove);
          window.removeEventListener("mouseup", onDragMouseUp);

          if (hasMovedDuringDrag) {
            suppressNextClick = true;
            if (suppressTimeoutId) clearTimeout(suppressTimeoutId);
            suppressTimeoutId = setTimeout(() => {
              suppressNextClick = false;
              hasMovedDuringDrag = false;
            }, 300);

            if (window.pywebview && window.pywebview.api && window.pywebview.api.save_hud_position) {
              window.pywebview.api.save_hud_position();
            }
          }
        }
      }

      overlayCard.addEventListener("mousedown", onDragMouseDown);

      // =========================================================================
      // 8-Directional Window Resizing & Scaling (Normal & Max Modes)
      // =========================================================================
      let isResizing = false;
      let resizeDir = null;
      let resizeStartX = 0;
      let resizeStartY = 0;
      let resizeStartW = 0;
      let resizeStartH = 0;
      let resizeStartWinX = 0;
      let resizeStartWinY = 0;
      let pendingResize = null;

      document.querySelectorAll(".hud-resizer").forEach(el => {
        el.addEventListener("mousedown", async (e) => {
          if (e.button !== 0) return;
          if (currentMode === "mini") return; // Mini mode is locked pill
          e.preventDefault();
          e.stopPropagation();

          isResizing = true;
          resizeDir = el.getAttribute("data-dir") || "br";
          resizeStartX = e.screenX;
          resizeStartY = e.screenY;
          resizeStartW = window.innerWidth;
          resizeStartH = window.innerHeight;

          if (window.pywebview && window.pywebview.api && window.pywebview.api.get_window_bounds) {
            try {
              const res = await window.pywebview.api.get_window_bounds();
              if (res && res.bounds) {
                resizeStartWinX = res.bounds.x || 0;
                resizeStartWinY = res.bounds.y || 0;
              }
            } catch(err) {}
          }

          window.addEventListener("mousemove", onResizeMouseMove);
          window.addEventListener("mouseup", onResizeMouseUp);
        });
      });

      function onResizeMouseMove(e) {
        if (!isResizing) return;
        const dx = e.screenX - resizeStartX;
        const dy = e.screenY - resizeStartY;

        const minW = currentMode === "max" ? 360 : 320;
        const minH = currentMode === "max" ? 220 : 130;

        let newW = resizeStartW;
        let newH = resizeStartH;
        let newX = null;
        let newY = null;

        // Horizontal sizing
        if (resizeDir.includes("r")) {
          newW = Math.max(minW, resizeStartW + dx);
        } else if (resizeDir.includes("l")) {
          const candW = resizeStartW - dx;
          if (candW >= minW) {
            newW = candW;
            newX = resizeStartWinX + dx;
          } else {
            newW = minW;
            newX = resizeStartWinX + (resizeStartW - minW);
          }
        }

        // Vertical sizing
        if (resizeDir.includes("b")) {
          newH = Math.max(minH, resizeStartH + dy);
        } else if (resizeDir.includes("t")) {
          const candH = resizeStartH - dy;
          if (candH >= minH) {
            newH = candH;
            newY = resizeStartWinY + dy;
          } else {
            newH = minH;
            newY = resizeStartWinY + (resizeStartH - minH);
          }
        }

        if (!pendingResize) {
          pendingResize = requestAnimationFrame(() => {
            pendingResize = null;
            if (window.pywebview && window.pywebview.api && window.pywebview.api.resize_overlay) {
              window.pywebview.api.resize_overlay(
                Math.round(newW),
                Math.round(newH),
                newX !== null ? Math.round(newX) : null,
                newY !== null ? Math.round(newY) : null
              );
            }
          });
        }
      }

      function onResizeMouseUp(e) {
        if (isResizing) {
          isResizing = false;
          window.removeEventListener("mousemove", onResizeMouseMove);
          window.removeEventListener("mouseup", onResizeMouseUp);

          const finalW = window.innerWidth;
          const finalH = window.innerHeight;
          if (window.pywebview && window.pywebview.api && window.pywebview.api.save_hud_size) {
            window.pywebview.api.save_hud_size(currentMode, finalW, finalH);
          }
        }
      }

      modeMiniBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        switchMode("mini");
      });

      modeNormalBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        switchMode("normal");
      });

      modeMaxBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        switchMode("max");
      });

      // Mini mode pill clicking toggles back to Normal mode (suppressed if dragged)
      overlayCard.addEventListener("click", (e) => {
        if (suppressNextClick || hasMovedDuringDrag) {
          suppressNextClick = false;
          hasMovedDuringDrag = false;
          e.stopPropagation();
          e.preventDefault();
          return;
        }
        if (currentMode === "mini") {
          e.stopPropagation();
          switchMode("normal");
        }
      }, true);

      // =========================================================================
      // Status & State Indicator
      // =========================================================================
      function setStatus(state, message, userPrompt, action) {
        currentStatusState = state || "standby";
        const isStandby = (currentStatusState === "standby" || currentStatusState === "idle" || currentStatusState === "disconnected" || currentStatusState === "offline");

        document.body.classList.toggle("status-standby", isStandby);

        const style = stateStyles[currentStatusState] || {
          color: isStandby ? "#8e9bb0" : "#00d2ff",
          label: (currentStatusState || "STANDBY").toUpperCase(),
          icon: isStandby ? "💤" : "⚡"
        };

        document.documentElement.style.setProperty("--current-status-color", style.color);

        // Standard status indicator
        statusDot.style.background = style.color;
        statusDot.style.boxShadow = isStandby ? "none" : `0 0 8px ${style.color}`;
        if (isStandby) {
          statusDot.classList.remove("pulse");
        } else {
          statusDot.classList.add("pulse");
        }
        statusLabel.style.color = style.color;
        statusLabel.innerText = style.label;

        // Mini status indicator
        miniStatusDot.style.background = style.color;
        miniStatusDot.style.boxShadow = isStandby ? "none" : `0 0 10px ${style.color}`;
        if (isStandby) {
          miniStatusDot.classList.remove("pulse");
        } else {
          miniStatusDot.classList.add("pulse");
        }
        miniStatusLabel.style.color = style.color;
        miniStatusLabel.innerText = getMiniStatus(currentStatusState);

        if (action) {
          actionIcon.innerText = "⚙️";
          agentActionText.innerText = `Action: ${action}`;
        } else if (message) {
          actionIcon.innerText = style.icon;
          agentActionText.innerText = message;
        } else if (isStandby) {
          actionIcon.innerText = "💤";
          agentActionText.innerText = `${agentName} on standby`;
        }

        // Only update user prompt if not currently speaking/answering
        if (userPrompt && state !== "speaking") {
          updateNormalUserText(userPrompt, state);
        }
      }

      // =========================================================================
      // Mode 2: Normal Mode Single-Turn Q&A Exchange (Clears with each prompt)
      // =========================================================================
      let normalUserPrompt = "";
      let normalAgentResponse = "";
      let normalTurnState = "idle"; // "idle" | "listening" | "answering" | "done"
      let normalAgentHasChunk = false;

      function resetNormalTurn(userText) {
        normalTurnState = "listening";
        normalAgentHasChunk = false;
        normalUserPrompt = userText || "";
        normalAgentResponse = "";

        if (normalUserText) {
          normalUserText.innerText = userText ? `"${userText}"` : '"Listening for speech..."';
        }
        if (normalAgentText) {
          normalAgentText.innerHTML = renderMarkdown("Thinking...");
          normalAgentText.classList.remove("interrupted");
          normalAgentText.scrollTop = 0;
        }
      }

      function updateNormalUserText(userText, state) {
        if (!userText) return;
        // Never reset turn if we are speaking or actively answering
        if (state === "speaking" || normalTurnState === "answering") {
          return;
        }
        // If previous turn finished and new prompt arrived, reset for new turn
        if (normalTurnState === "done" || normalTurnState === "idle") {
          resetNormalTurn(userText);
        } else {
          normalUserPrompt = userText;
          if (normalUserText) {
            normalUserText.innerText = `"${userText}"`;
          }
        }
      }

      function setNormalAgentResponse(text) {
        if (!text) return;
        normalAgentResponse = text;
        normalTurnState = "answering";
        normalAgentHasChunk = true;
        if (normalAgentText) {
          normalAgentText.innerHTML = renderMarkdown(text);
          normalAgentText.classList.remove("interrupted");
          normalAgentText.scrollTop = normalAgentText.scrollHeight;
        }
      }

      function appendNormalAgentChunk(chunk) {
        if (!chunk) return;
        // Prevent duplicate append if the full response was already set by setNormalAgentResponse
        if (normalAgentResponse === chunk) return;

        if (!normalAgentHasChunk) {
          normalAgentResponse = "";
          normalAgentHasChunk = true;
          normalTurnState = "answering";
          if (normalAgentText) {
            normalAgentText.innerHTML = "";
            normalAgentText.classList.remove("interrupted");
          }
        }
        normalAgentResponse += chunk;
        if (normalAgentText) {
          normalAgentText.innerHTML = renderMarkdown(normalAgentResponse);
          normalAgentText.scrollTop = normalAgentText.scrollHeight;
        }
      }

      function completeNormalTurn(finalContent) {
        normalTurnState = "done";
        if (finalContent) {
          normalAgentResponse = finalContent;
          if (normalAgentText) {
            normalAgentText.innerHTML = renderMarkdown(finalContent);
            normalAgentText.scrollTop = normalAgentText.scrollHeight;
          }
        }
      }

      function interruptNormalTurn() {
        if (normalAgentText) {
          if (normalAgentResponse && !normalAgentResponse.endsWith("[Interrupted]")) {
            normalAgentResponse += " [Interrupted]";
            normalAgentText.innerHTML = renderMarkdown(normalAgentResponse);
          } else if (!normalAgentResponse) {
            normalAgentText.innerHTML = renderMarkdown("[Interrupted]");
          }
          normalAgentText.classList.add("interrupted");
        }
        normalTurnState = "done";
      }

      // =========================================================================
      // Max Mode Teleprompter Transcript Logic
      // =========================================================================
      function startNewAgentTurn(initialText) {
        if (!transcriptPane) return;

        // Dim older turns to opacity: 0.5
        const previousTurns = transcriptPane.querySelectorAll(".transcript-turn");
        previousTurns.forEach(t => {
          t.classList.remove("active");
          t.classList.add("dimmed");
        });

        const turnDiv = document.createElement("div");
        turnDiv.className = "transcript-turn active";

        const headerDiv = document.createElement("div");
        headerDiv.className = "turn-header";

        const speakerTag = document.createElement("span");
        speakerTag.className = "turn-speaker agent";
        speakerTag.innerText = agentName.toUpperCase();
        headerDiv.appendChild(speakerTag);

        const bodyDiv = document.createElement("div");
        bodyDiv.className = "turn-body";
        currentTurnRawText = initialText || "";
        bodyDiv.innerHTML = renderMarkdown(currentTurnRawText);

        turnDiv.appendChild(headerDiv);
        turnDiv.appendChild(bodyDiv);
        transcriptPane.appendChild(turnDiv);

        currentTurnDiv = turnDiv;
        currentTurnSpan = bodyDiv;

        transcriptPane.scrollTo({ top: transcriptPane.scrollHeight, behavior: 'smooth' });
      }

      function setMaxAgentResponse(text) {
        if (!text) return;
        const pane = document.getElementById("transcript-pane");
        if (!pane) return;

        currentTurnRawText = text;
        if (!currentTurnSpan) {
          startNewAgentTurn(text);
        } else {
          currentTurnSpan.innerHTML = renderMarkdown(text);
        }
        pane.scrollTo({ top: pane.scrollHeight, behavior: 'smooth' });
      }

      function appendAgentText(chunk) {
        if (!chunk) return;
        const pane = document.getElementById("transcript-pane");
        if (!pane) return;

        // Prevent duplicate text if full response was already set by setMaxAgentResponse
        if (currentTurnRawText === chunk) return;

        if (!currentTurnSpan) {
          startNewAgentTurn();
        }

        currentTurnRawText += chunk;
        const isNearBottom = pane.scrollHeight - pane.scrollTop - pane.clientHeight < 60;

        currentTurnSpan.innerHTML = renderMarkdown(currentTurnRawText);

        if (isNearBottom) {
          pane.scrollTo({ top: pane.scrollHeight, behavior: 'smooth' });
        }
      }

      function completeAgentTurn(finalContent) {
        if (finalContent) {
          currentTurnRawText = finalContent;
          if (currentTurnSpan) {
            currentTurnSpan.innerHTML = renderMarkdown(finalContent);
          } else {
            startNewAgentTurn(finalContent);
          }
        }
        if (currentTurnDiv) {
          currentTurnDiv.classList.remove("active");
          currentTurnDiv.classList.add("dimmed");
        }
        currentTurnSpan = null;
        currentTurnDiv = null;
        currentTurnRawText = "";
      }

      function interruptAgentTurn() {
        if (currentTurnSpan) {
          currentTurnRawText += " [Interrupted]";
          currentTurnSpan.innerHTML = renderMarkdown(currentTurnRawText);
          currentTurnSpan.classList.add("interrupted");
        }
        if (currentTurnDiv) {
          currentTurnDiv.classList.remove("active");
          currentTurnDiv.classList.add("dimmed");
        }
        currentTurnSpan = null;
        currentTurnDiv = null;
        currentTurnRawText = "";
      }

      function addUserTurnToTranscript(userText) {
        if (!transcriptPane || !userText) return;

        // Dim older turns
        const previousTurns = transcriptPane.querySelectorAll(".transcript-turn");
        previousTurns.forEach(t => {
          t.classList.remove("active");
          t.classList.add("dimmed");
        });

        const turnDiv = document.createElement("div");
        turnDiv.className = "transcript-turn dimmed";

        const headerDiv = document.createElement("div");
        headerDiv.className = "turn-header";

        const speakerTag = document.createElement("span");
        speakerTag.className = "turn-speaker user";
        speakerTag.innerText = "USER";
        headerDiv.appendChild(speakerTag);

        const bodyDiv = document.createElement("div");
        bodyDiv.className = "turn-body";
        bodyDiv.innerText = `"${userText}"`;

        turnDiv.appendChild(headerDiv);
        turnDiv.appendChild(bodyDiv);
        transcriptPane.appendChild(turnDiv);

        transcriptPane.scrollTo({ top: transcriptPane.scrollHeight, behavior: 'smooth' });
      }

      // =========================================================================
      // Event listener registered on window for backend GuiBridge calls
      // =========================================================================
      window.aetherOverlay = {
        setMode: function(mode) {
          applyModeClasses(mode);
        },
        setAgentName: function(name) {
          updateAgentName(name);
        },

        handleEvent: function(event) {
          if (!event) return;
          const type = event.type;
          const data = event.data || {};

          if (type === "config_updated") {
            const apiCfg = (data && data.api) || {};
            if (apiCfg.agent_name) {
              updateAgentName(apiCfg.agent_name);
            }
          } else if (type === "hud_mode_changed") {
            if (data.mode) {
              applyModeClasses(data.mode);
            }
          } else if (type === "agent_speech_chunk") {
            if (data.chunk) {
              appendNormalAgentChunk(data.chunk);
              appendAgentText(data.chunk);
            }
          } else if (type === "agent_turn_complete") {
            completeNormalTurn(data.content);
            completeAgentTurn(data.content);
          } else if (type === "agent_turn_interrupted") {
            interruptNormalTurn();
            interruptAgentTurn();
          } else if (type === "status") {
            setStatus(data.state, data.message, data.user_prompt, data.action);
          } else if (type === "chat_event") {
            if (data.type === "user") {
              resetNormalTurn(data.content);
              addUserTurnToTranscript(data.content);
            } else if (data.type === "tool") {
              actionIcon.innerText = "⚙️";
              agentActionText.innerText = `${data.name || "Tool"}: ${data.content || ""}`;
            } else if (data.type === "assistant") {
              actionIcon.innerText = "🔊";
              const cleanSummary = (data.content || '').replace(/\s+/g, ' ').trim();
              agentActionText.innerText = `${agentName}: ${cleanSummary.slice(0, 60)}${cleanSummary.length > 60 ? '...' : ''}`;
              setNormalAgentResponse(data.content);
              setMaxAgentResponse(data.content);
            }
          } else if (type === "user_speech_stream") {
            if (data.text) {
              updateNormalUserText(data.text);
            }
          } else if (type === "mic_muted") {
            isMuted = !!data.muted;
            muteBtn.classList.toggle("muted", isMuted);
            muteBtn.innerText = isMuted ? "🔇" : "🎤";
          } else if (type === "mic_status") {
            const isPttActive = !!data.ptt_active;
            muteBtn.classList.toggle("active", isPttActive);
            if (isPttActive) {
              setStatus("hearing", "PTT Transmitting...", null, "Speaking into microphone");
            }
          }
        }
      };

      // Button Handlers
      restoreBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        if (window.pywebview && window.pywebview.api && window.pywebview.api.restore_main_window) {
          window.pywebview.api.restore_main_window();
        }
      });

      hideBtn.addEventListener("click", function(e) {
        e.stopPropagation();
        if (window.pywebview && window.pywebview.api && window.pywebview.api.hide_overlay) {
          window.pywebview.api.hide_overlay();
        }
      });

      muteBtn.addEventListener("click", async function(e) {
        e.stopPropagation();
        if (window.pywebview && window.pywebview.api && window.pywebview.api.toggle_mic_mute) {
          const res = await window.pywebview.api.toggle_mic_mute();
          if (res && res.success) {
            isMuted = res.muted;
            muteBtn.classList.toggle("muted", isMuted);
            muteBtn.innerText = isMuted ? "🔇" : "🎤";
          }
        }
      });

      // Query initial configuration & theme upon pywebview ready
      window.addEventListener("pywebviewready", async function() {
        if (window.pywebview && window.pywebview.api) {
          try {
            if (window.pywebview.api.get_windows_theme) {
              const theme = await window.pywebview.api.get_windows_theme();
              if (theme && theme.accent_color) {
                document.documentElement.style.setProperty("--accent", theme.accent_color);
              }
            }
            if (window.pywebview.api.get_overlay_config) {
              const oCfg = await window.pywebview.api.get_overlay_config();
              if (oCfg && oCfg.state) {
                setStatus(oCfg.state);
              } else {
                setStatus("standby");
              }
              if (oCfg && oCfg.agent_name) {
                updateAgentName(oCfg.agent_name);
              }
              if (oCfg && oCfg.hud_mode) {
                applyModeClasses(oCfg.hud_mode);
              }
            } else {
              setStatus("standby");
              if (window.pywebview.api.get_hud_mode) {
                const modeRes = await window.pywebview.api.get_hud_mode();
                if (modeRes && modeRes.mode) {
                  applyModeClasses(modeRes.mode);
                }
              }
              if (window.pywebview.api.get_agent_name) {
                const nameRes = await window.pywebview.api.get_agent_name();
                if (nameRes && nameRes.agent_name) {
                  updateAgentName(nameRes.agent_name);
                }
              }
            }
            if (window.pywebview.api.apply_shape) {
              window.pywebview.api.apply_shape();
            }
          } catch(e) {}
        }
      });
    })();
  </script>
</body>
</html>
