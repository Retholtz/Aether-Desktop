<!-- APPLICATION & STARTUP BEHAVIOR -->
<div class="settings-card">
  <div class="settings-card-header">
    <h3>APPLICATION & STARTUP BEHAVIOR</h3>
  </div>

  <div class="settings-grid">
    <div class="grid-row row-double">
      <!-- Toggle: Boot on Startup -->
      <div class="form-group toggle-group">
        <label class="toggle-container">
          <input type="checkbox" id="toggle-boot-startup" />
          <span class="toggle-slider"></span>
          <span class="toggle-label">Launch Aether on Windows Startup</span>
        </label>
        <span class="field-hint">Automatically boots Aether in the background when Windows starts up.</span>
      </div>

      <!-- Toggle: Start Minimized -->
      <div class="form-group toggle-group">
        <label class="toggle-container">
          <input type="checkbox" id="toggle-start-minimized" />
          <span class="toggle-slider"></span>
          <span class="toggle-label">Start Minimized to Tray</span>
        </label>
        <span class="field-hint">Launches Aether directly into the taskbar/system tray without taking screen focus.</span>
      </div>
    </div>
  </div>
</div>
